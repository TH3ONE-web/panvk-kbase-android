name: build
on: [workflow_dispatch]

jobs:
  build-x6-pro-8gb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Install Modern Meson & All Mesa/Android Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv ninja-build python3-mako python3-yaml python3-ply bison flex cmake glslang-tools spirv-tools zip unzip jq pkg-config libdrm-dev libelf-dev libexpat1-dev zlib1g-dev libzstd-dev libclang-18-dev libllvmspirvlib-18-dev llvm-spirv-18 x11proto-dev libx11-dev libx11-xcb-dev libxshmfence-dev libxext-dev libxfixes-dev libxrandr-dev libxxf86vm-dev libxcb1-dev libxcb-dri2-0-dev libxcb-dri3-dev libxcb-glx0-dev libxcb-present-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-xfixes0-dev libwayland-dev wayland-protocols
          pip install --break-system-packages --upgrade meson
          meson --version

      - name: Fetch Mesa, Bootstrap Tools & Apply G615 Patches
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/fetch-mesa.sh
          ./scripts/bootstrap-host-tools.sh
          ./scripts/apply-patches.sh --profile g615-v11-csf
          sed -i 's/gs_bo_pool/cs_bo_pool/g' work/mesa/src/panfrost/vulkan/panvk_cmd_pool.c

      - name: Inject Dimensity 8300 Ultra (Cortex-A715) & 8GB RAM Optimizations
        run: |
          find . -maxdepth 3 -type f \( -name "*.txt" -o -name "*.sh" -o -name "*.meson" \) -exec sed -i "s/-O2/-O3 -march=armv9-a+simd -mtune=cortex-a715 -flto=thin -DNDEBUG -fomit-frame-pointer/g" {} +
          sed -i "s/meson setup/meson setup -Db_ndebug=true -Dcpp_rtti=false -Dshader-cache=enabled -Dshader-cache-default=true/g" scripts/build-android.sh

      - name: Build Android Deps, PanVK G615 & Package ZIP
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./scripts/build-android-deps.sh
          ./scripts/build-android.sh --profile g615-v11-csf
          SO_PATH="dist/android-g615-v11-csf/libvulkan_panfrost.so"
          ./scripts/package-android-adpkg.sh --so "$SO_PATH" --profile g615-v11-csf || true
          mkdir -p out_driver
          cp "$SO_PATH" out_driver/libvulkan_panfrost.so
          cat << 'EOF' > out_driver/meta.json
          {
            "schemaVersion": 1,
            "name": "PanVK Poco X6 Pro 8GB MaxPerf (DXVK 2.6)",
            "description": "Mesa PanVK Vulkan 1.3 optimizado para Mali-G615 MC6 y Dimensity 8300 Ultra (8GB RAM)",
            "author": "TH3ONE-web",
            "packageVersion": "1",
            "vendor": "Mesa",
            "driverVersion": "26.0-g615-maxperf",
            "minApi": 31,
            "libraryName": "libvulkan_panfrost.so"
          }
          EOF
          cd out_driver && zip -r ../dist/PanVK-PocoX6Pro-8GB-MaxPerf.zip libvulkan_panfrost.so meta.json

      - name: Upload Poco X6 Pro 8GB Driver
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-PocoX6Pro-8GB-DXVK26-BO2
          path: dist/*.zip
